<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roadsurfer Rally map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230066cc'/%3E%3Cpath d='M8 24Q9 9 24 8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='24' r='4' fill='%230066cc' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='24' cy='8' r='4.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --accent: #06c; --link: #067a3f; --muted: #555; }
  html, body { height: 100%; margin: 0; font: 13px system-ui, sans-serif; color: #1a1a1a; }
  body { display: flex; flex-direction: column; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bar { box-sizing: border-box; padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 6px; background: #f4f4f4; border-bottom: 1px solid #ccc; }
  #top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  h1 { margin: 0 auto 0 0; font-size: 15px; }
  #updated { color: var(--muted); white-space: nowrap; }
  #updated:not(:empty)::after { content: " \00b7"; }
  #count { font-weight: 600; white-space: nowrap; }
  #bar input, #bar select, #bar button { font: inherit; color: inherit; padding: 3px 6px; border: 1px solid #767676; border-radius: 4px; background: #fff; }
  #bar button { cursor: pointer; }
  #bar button:hover { background: #e8e8e8; }
  #filters { display: none; }
  #filt { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 14px; }
  #filt fieldset { margin: 0; padding: 0 0 0 7px; border: 0; border-left: 3px solid transparent; }
  #filt legend { padding: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  #filt fieldset.on { border-left-color: var(--accent); }
  #filt fieldset.on legend { color: var(--accent); }
  .f { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .f label { display: flex; gap: 4px; align-items: center; }
  #filt select { max-width: 170px; }
  #kmin, #kmax { width: 60px; }
  #bar #week { width: 90px; padding: 0; border: 0; accent-color: var(--accent); }
  #bar input.on, #bar select.on { border-color: var(--accent); background: #e6f0fa; box-shadow: inset 0 0 0 1px var(--accent); }
  #main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #map { flex: 1; }
  #list { flex: 1; overflow: auto; display: none; }
  body.list #map { display: none; }
  body.list #list { display: block; }
  #list table, .pop table { border-collapse: collapse; }
  #list table { width: auto; min-width: 60%; }
  .pop table { width: 100%; }
  #list th, #list td { padding: 5px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid #e4e4e4; }
  #list th, .pop th { position: sticky; top: 0; background: #fafafa; }
  #list th { box-shadow: inset 0 -1px #ccc; }
  #list th button { font: inherit; font-weight: 600; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; }
  #list th.km, #list td.km { text-align: right; }
  #list tbody tr:hover, #list tbody tr:focus-within { background: #eef5ff; }
  #list button.show { font: inherit; color: inherit; padding: 1px 6px; border: 1px solid #767676; border-radius: 4px; background: #fff; cursor: pointer; }
  #list button.show:hover { background: #e8e8e8; }
  #list td a, .pop a { color: var(--link); font-weight: 600; }
  .pop { font-size: 13px; }
  .pop h2 { margin: 0 0 2px; font-size: 14px; }
  .pop p { margin: 0 0 6px; color: var(--muted); }
  .pop .trips { max-height: 220px; overflow: auto; }
  .pop th, .pop td { padding: 3px 8px 3px 0; text-align: left; white-space: nowrap; border-bottom: 1px solid #eee; }
  .pop th { font-weight: 600; color: var(--muted); }
  .legend { background: #fff; padding: 6px 8px; font-size: 12px; }
  .legend summary { cursor: pointer; font-weight: 600; }
  .legend ul { list-style: none; margin: 4px 0 0; padding: 0; }
  .legend li { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .legend svg { width: 28px; height: 14px; flex: none; }
  .leaflet-control-attribution a { color: #005f87; }
  #credit, #release { padding: 2px 12px; font-size: 11px; color: var(--muted); background: #f4f4f4; border-top: 1px solid #ccc; }
  #credit:empty, #release:empty { display: none; }
  #release a { color: var(--accent); }
  @media (max-width: 700px) {
    #updated { order: 3; flex-basis: 100%; font-size: 11px; }
    #updated:not(:empty)::after { content: none; }
    #count { margin-right: auto; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #filters { display: inline-block; }
    #filt { display: none; max-height: 60vh; overflow: auto; flex-direction: column; align-items: stretch; gap: 8px; padding-top: 2px; }
    body.filt #filt { display: flex; }
    #bar input, #bar select, #bar button { font-size: 16px; }
    #filt select { max-width: none; flex: 1; min-width: 0; }
    #bar #week { flex: 1; }
    #from, #to { flex: 1; min-width: 0; }
    .f label { flex-basis: 100%; }
    #reset { align-self: flex-start; }
    #list table { width: 100%; font-size: 12px; }
    .wide { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #list th, #list td { padding: 4px 2px; }
    #list button.show { padding: 1px 4px; font-size: 11px; }
    #list td.st { white-space: normal; }
  }
  /* grow the tap area, not the rows */
  @media (pointer: coarse) {
    #list td a, .pop td a { display: inline-block; padding: 6px 0; margin: -6px 0; }
    #list button.show { padding: 6px 4px; margin: -6px 0; }
  }
</style>
</head>
<body>
<header id="bar">
  <div id="top">
    <h1>roadsurfer Rally map</h1>
    <span id="updated"></span>
    <span id="count" aria-live="polite" aria-atomic="true"></span>
    <button id="filters" aria-expanded="false" aria-controls="filt">Filters</button>
    <button id="view">List</button>
  </div>
  <div id="filt">
    <fieldset id="gdate"><legend>Start date</legend><div class="f">
      <input type="date" id="from" aria-label="Earliest start date"> &ndash;
      <input type="date" id="to" aria-label="Latest start date">
      <label>week <input type="range" id="week" min="0" max="0" value="0" aria-valuetext="all dates"></label>
    </div></fieldset>
    <fieldset id="gkm"><legend>Distance</legend><div class="f">
      <input type="number" id="kmin" min="0" step="50" aria-label="Minimum distance in km"> &ndash;
      <input type="number" id="kmax" min="0" step="50" aria-label="Maximum distance in km"> km
    </div></fieldset>
    <fieldset id="gfrom"><legend>Pick-up</legend><div class="f">
      <select id="fcc" aria-label="Pick-up country"></select>
      <select id="fst" aria-label="Pick-up station"></select>
    </div></fieldset>
    <fieldset id="gto"><legend>Return</legend><div class="f">
      <select id="tcc" aria-label="Return country"></select>
      <select id="tst" aria-label="Return station"></select>
    </div></fieldset>
    <button id="reset">Reset</button>
  </div>
</header>
<main id="main">
  <div id="map" role="region" aria-label="Route map"></div>
  <div id="list" role="region" aria-label="Trip list"></div>
</main>
<footer id="credit"></footer>
<footer id="release"></footer>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
const DATA = /*DATA*/[];
const SCAN = /*SCAN*/null;
const RELEASE = /*RELEASE*/null;
const COL = '#06c', HOT = '#e60';
const map = L.map('map');
map.createPane('stations').style.zIndex = 450;  // above the route lines, so a raised line never covers a station
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles © Esri' }).addTo(map);
const layer = L.featureGroup().addTo(map);
const weight = n => Math.min(1.5 + n * .7, 5);
const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => {
  const d = L.DomUtil.create('details', 'legend leaflet-bar');
  const line = w => `<svg viewBox="0 0 28 14" aria-hidden="true"><path d="M2 7H26" stroke="${COL}" stroke-width="${w}" stroke-opacity=".4"/></svg>`;
  const dot = `<svg viewBox="0 0 28 14" aria-hidden="true"><circle cx="14" cy="7" r="5" stroke="#fff" stroke-width="1.5" fill="${COL}"/></svg>`;
  // arc() bends every route to the right of its direction of travel (pick-up -> return)
  const bend = `<svg viewBox="0 0 28 14" aria-hidden="true"><path d="M2 3Q14 15 26 3M21.5 3.5L26 3L25.5 7.5" fill="none" stroke="${COL}" stroke-width="1.5"/></svg>`;
  d.innerHTML = '<summary>Legend</summary><ul>' +
    `<li>${line(weight(1))} route with 1 trip</li><li>${line(weight(5))} route with 5 or more trips</li>` +
    `<li>${dot} station (click to filter pick-ups)</li>` +
    `<li>${bend} arcs bend right of the way you travel, from pick-up to return</li></ul>`;
  d.open = matchMedia('(min-width: 701px)').matches;
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.disableScrollPropagation(d);
  return d;
};
legend.addTo(map);

function arc(a, b, n = 40) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const cx = mx - (b[1] - a[1]) * 0.2, cy = my + (b[0] - a[0]) * 0.2;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0], u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
  }
  return pts;
}

// fallback for records without a routed km: great-circle distance x 1.3
function roadKm(a, b) {
  const R = Math.PI / 180, dLa = (b.latitude - a.latitude) * R, dLo = (b.longitude - a.longitude) * R;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.latitude * R) * Math.cos(b.latitude * R) * Math.sin(dLo / 2) ** 2;
  return Math.round(12742 * Math.asin(Math.sqrt(h)) * 1.3 / 10) * 10;
}
// the scanner stores the routed km in the record; km_estimated marks its own x 1.3 fallback
function dist(r) {
  if (typeof r.km === 'number' && isFinite(r.km)) return { km: r.km, est: r.km_estimated === true };
  return { km: roadKm(r.from, r.to), est: true };
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const day = s => Date.parse(s + 'T00:00:00Z');
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const min = DATA.map(r => r.start).sort()[0], max = DATA.map(r => r.end).sort().pop();
if (min) { $('from').value = min; $('to').value = max; }
const kms = DATA.map(r => dist(r).km);
if (kms.length) { $('kmin').placeholder = Math.min(...kms); $('kmax').placeholder = Math.max(...kms); }
$('week').max = min ? Math.ceil((day(max) - day(min)) / 864e5 / 7) : 0;

// scan metadata is absent in pages rendered from older data files: show nothing
const done = SCAN && typeof SCAN.finished_at === 'string' ? Date.parse(SCAN.finished_at) : NaN;
if (!isNaN(done)) {
  $('updated').textContent = 'updated ' + new Date(done).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  $('updated').title = `scan finished ${SCAN.finished_at} \u00b7 ${SCAN.offers} offers \u00b7 ${SCAN.requests} requests, ${SCAN.failed} failed`;
}

// OSRM routes on OpenStreetMap data; ~ marks a distance that was not routed
const credit = [];
if (DATA.some(r => !dist(r).est)) credit.push('Road distances: <a href="https://project-osrm.org/" target="_blank" rel="noopener">OSRM</a>, data \u00a9 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.');
if (DATA.some(r => dist(r).est)) credit.push('~ marks an estimated distance (straight line \u00d7 1.3), not routed.');
$('credit').innerHTML = credit.join(' ');

// release tag, null when rendered without --release: the footer stays empty and hidden
if (typeof RELEASE === 'string' && RELEASE) {
  const a = document.createElement('a');
  a.href = 'https://github.com/gjed/roadsurfer-rally-map/releases/tag/' + encodeURIComponent(RELEASE);
  a.textContent = RELEASE;
  $('release').append('release ', a);
}

// Faceted filters: each dropdown only offers values that still have offers
// under every OTHER active filter, so incompatible combinations can't be picked.
const FILTERS = {
  fcc: r => r.from.cc, fst: r => r.from.name,
  tcc: r => r.to.cc,   tst: r => r.to.name,
};
const sel = {};  // current selections, '' = any
const NOUN = { fcc: 'country', fst: 'station', tcc: 'country', tst: 'station' };
// a filter is active when it differs from its reset value; groups mirror the fieldsets
const GROUPS = { gdate: ['from', 'to'], gkm: ['kmin', 'kmax'], gfrom: ['fcc', 'fst'], gto: ['tcc', 'tst'] };
const RESET = { from: min || '', to: max || '' };

function markActive() {
  let n = 0;
  for (const g in GROUPS) {
    let on = false;
    for (const id of GROUPS[g]) {
      const a = $(id).value !== (RESET[id] || '');
      $(id).classList.toggle('on', a);
      on = on || a;
    }
    $(g).classList.toggle('on', on);
    n += on;
  }
  $('filters').textContent = n ? `Filters (${n})` : 'Filters';
}

function passes(r, skip) {
  if (day(r.start) < day($('from').value) || day(r.start) > day($('to').value)) return false;
  const km = dist(r).km;
  if (km < +$('kmin').value || ($('kmax').value !== '' && km > +$('kmax').value)) return false;
  for (const k in FILTERS) if (k !== skip && sel[k] && FILTERS[k](r) !== sel[k]) return false;
  return true;
}

function fillSelects() {
  for (const k in FILTERS) {
    const counts = new Map();
    for (const r of DATA) if (passes(r, k)) counts.set(FILTERS[k](r), (counts.get(FILTERS[k](r)) || 0) + 1);
    if (sel[k] && !counts.has(sel[k])) sel[k] = '';  // selection became impossible -> clear it
    const el = $(k);
    el.innerHTML = `<option value="">any ${NOUN[k]} (` + [...counts.values()].reduce((a, b) => a + b, 0) + ')</option>' +
      [...counts].sort((a, b) => a[0].localeCompare(b[0]))
        .map(([v, n]) => `<option value="${esc(v)}"${v === sel[k] ? ' selected' : ''}>${esc(v)} (${n})</option>`).join('');
  }
}

// the list shows the same trips as the map: render() hands it what passes()
const hasPrice = DATA.some(r => r.price);
const SORTS = { start: r => r.start, end: r => r.end, km: r => dist(r).km };
let shown = [], sortKey = 'start', sortDir = 1;
const lines = new Map();  // route key -> arc, to open a route from the list
let fitted = false;
const routeKey = r => r.from.name + '>' + r.to.name;

const kmCell = r => {
  const d = dist(r);
  return d.est ? `<span title="estimated: straight line \u00d7 1.3, not routed">~${d.km}</span>` : d.km;
};

function renderList() {
  const f = SORTS[sortKey];
  shown.sort((x, y) => {
    const a = f(x), b = f(y);
    return (a < b ? -1 : a > b ? 1 : 0) * sortDir || x.start.localeCompare(y.start) || x.from.name.localeCompare(y.from.name);
  });
  const th = (k, t) => `<th${k === 'km' ? ' class="km"' : ''} aria-sort="${k === sortKey ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${k}">${t}${k === sortKey ? (sortDir > 0 ? ' \u25b2' : ' \u25bc') : ''}</button></th>`;
  // narrow screens show MM-DD; the year stays in the title and for screen readers
  const d = s => `<td class="d" title="${esc(s)}"><span class="wide">${esc(s.slice(0, 5))}</span>${esc(s.slice(5))}</td>`;
  const rows = shown.map(r => `<tr>${d(r.start)}${d(r.end)}` +
    `<td class="st">${esc(r.from.name)} (${esc(r.from.cc)})</td><td class="st">${esc(r.to.name)} (${esc(r.to.cc)})</td>` +
    `<td class="km">${kmCell(r)}</td>${hasPrice ? `<td>${r.price ? esc(r.price) : ''}</td>` : ''}` +
    `<td><a href="${esc(r.link)}" target="_blank" rel="noopener">book</a></td>` +
    `<td><button class="show" data-key="${esc(routeKey(r))}" aria-label="Show ${esc(r.from.name)} to ${esc(r.to.name)} on map">map</button></td></tr>`).join('');
  $('list').innerHTML = `<table><thead><tr>${th('start', 'Start')}${th('end', 'End')}<th>From</th><th>To</th>${th('km', 'km')}` +
    `${hasPrice ? '<th>Price</th>' : ''}<th><span class="sr">Booking</span></th><th><span class="sr">Map</span></th></tr></thead><tbody>` +
    (rows || `<tr><td colspan="${hasPrice ? 8 : 7}">No trips match the filters.</td></tr>`) + '</tbody></table>';
}

function setView(list) {
  document.body.classList.toggle('list', list);
  $('view').textContent = list ? 'Map' : 'List';
  if (!list) map.invalidateSize();
}

let fromRow = null;  // the list button that opened the current popup, to go back to it
function showRoute(btn, keyboard) {
  const line = lines.get(btn.dataset.key);
  if (!line) return;
  setView(false);
  map.fitBounds(line.getBounds(), { padding: [40, 40], maxZoom: 8, animate: false });
  line.openPopup();
  fromRow = { btn, line };
  // the focused button is hidden now: keep keyboard users in the popup
  if (keyboard) line.getPopup().getElement().querySelector('a').focus();
}

function render() {
  fillSelects();
  layer.clearLayers();
  lines.clear();
  shown = [];
  // one arc per route (from -> to); all matching dates are listed in its popup
  const routes = new Map(), stations = new Map();
  let n = 0;
  for (const r of DATA) {
    if (!passes(r)) continue;
    n++;
    shown.push(r);
    const key = routeKey(r);
    if (!routes.has(key)) routes.set(key, { from: r.from, to: r.to, trips: [] });
    routes.get(key).trips.push(r);
  }
  for (const [key, g] of routes) {
    g.trips.sort((x, y) => x.start.localeCompare(y.start));
    const a = [g.from.latitude, g.from.longitude], b = [g.to.latitude, g.to.longitude];
    const t = g.trips, N = t.length, d = dist(t[0]);
    const head = `${esc(g.from.name)} (${esc(g.from.cc)}) \u2192 ${esc(g.to.name)} (${esc(g.to.cc)})`;
    const rows = t.map(r => `<tr><td>${esc(r.start)}</td><td>${esc(r.end)}</td>${hasPrice ? `<td>${r.price ? esc(r.price) : ''}</td>` : ''}` +
      `<td><a href="${esc(r.link)}" target="_blank" rel="noopener">book</a></td></tr>`).join('');
    const pop = `<div class="pop"><h2>${head}</h2><p>${d.est ? `~${d.km} km (estimated)` : `${d.km} km by road`} \u00b7 ${N} trip${N > 1 ? 's' : ''}</p>` +
      `<div class="trips"><table><thead><tr><th>Start</th><th>End</th>${hasPrice ? '<th>Price</th>' : ''}<th><span class="sr">Booking</span></th></tr></thead>` +
      `<tbody>${rows}</tbody></table></div></div>`;
    const tip = `${head}<br>${d.est ? '~' : ''}${d.km} km${d.est ? ' (estimated)' : ''} \u00b7 ${N} trip${N > 1 ? 's' : ''}: ${esc(t[0].start)}${N > 1 ? ' \u2026 ' + esc(t[N - 1].start) : ''}`;
    const base = { color: COL, weight: weight(N), opacity: .4 };
    const line = L.polyline(arc(a, b), base).addTo(layer).bindPopup(pop).bindTooltip(tip, { sticky: true });
    lines.set(key, line);
    // hot while hovered or while its popup is open; a tap fires mouseover but no mouseout, so popupclose resets too
    line.on('mouseover popupopen', () => { line.setStyle({ color: HOT, opacity: 1 }); line.bringToFront(); })
      .on('mouseout', () => { if (!line.isPopupOpen()) line.setStyle(base); })
      .on('popupclose', () => line.setStyle(base));
    for (const [s, k] of [[g.from, 'dep'], [g.to, 'arr']]) {
      if (!stations.has(s.name)) stations.set(s.name, { s, dep: 0, arr: 0 });
      stations.get(s.name)[k] += N;
    }
  }
  // one marker per station: a stack of per-route markers would open an arbitrary route on click
  const count = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  for (const [name, g] of stations) {
    L.circleMarker([g.s.latitude, g.s.longitude], { pane: 'stations', radius: 5, color: '#fff', weight: 1.5, fillColor: COL, fillOpacity: 1 })
      .addTo(layer)
      .bindTooltip(`${esc(name)} (${esc(g.s.cc)})<br>${count(g.dep, 'departure')} \u00b7 ${count(g.arr, 'arrival')}`)
      .on('click', () => {
        if (!g.dep) return;  // arrival only: the pick-up dropdown has no such option
        sel.fst = name; $('fst').value = name; render();
      });
  }
  if (!fitted) {
    fitted = true;
    const bounds = layer.getBounds();
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20], maxZoom: 8 }); else map.setView([50, 9], 5);
  }
  // Chrome puts every clickable SVG path in the tab order; keyboard users reach routes via the list
  layer.eachLayer(l => l.getElement().setAttribute('tabindex', '-1'));
  $('count').textContent = routes.size + ' routes \u00b7 ' + n + ' / ' + DATA.length + ' trips';
  renderList();
  markActive();
}

$('week').oninput = () => {
  const s = day(min) + $('week').value * 7 * 864e5;
  $('from').value = iso(Math.max(s, day(min)));
  $('to').value = iso(Math.min(s + 6 * 864e5, day(max)));
  $('week').setAttribute('aria-valuetext', 'week of ' + $('from').value);
  render();
};
for (const k in FILTERS) $(k).onchange = () => { sel[k] = $(k).value; render(); };
['from', 'to', 'kmin', 'kmax'].forEach(id => $(id).oninput = render);
$('reset').onclick = () => {
  for (const k in FILTERS) sel[k] = '';
  $('from').value = min; $('to').value = max; $('week').value = 0; $('kmin').value = $('kmax').value = '';
  $('week').setAttribute('aria-valuetext', 'all dates');
  render();
};
$('filters').onclick = () => {
  const open = document.body.classList.toggle('filt');
  $('filters').setAttribute('aria-expanded', open);
  map.invalidateSize();
};
$('view').onclick = () => setView(!document.body.classList.contains('list'));
$('list').onclick = e => {
  const b = e.target.closest('button[data-sort]');
  if (b) {
    sortDir = b.dataset.sort === sortKey ? -sortDir : 1;
    sortKey = b.dataset.sort;
    renderList();
    $('list').querySelector(`[data-sort="${sortKey}"]`).focus();  // the header was redrawn
    return;
  }
  const m = e.target.closest('button[data-key]');
  if (m) showRoute(m, e.detail === 0);  // detail 0: activated with the keyboard
};
// Leaflet closes popups on Escape only while the map itself has focus.
// A popup opened from the list goes back to the list: its button is hidden while the map shows.
const back = () => fromRow && fromRow.line.isPopupOpen() && document.body.contains(fromRow.btn) ? fromRow.btn : null;
$('map').addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !e.target.closest('.leaflet-popup')) return;
  const btn = back();
  map.closePopup();
  if (btn) { setView(true); btn.focus(); } else $('map').focus();
});
render();
</script>
</body>
</html>
