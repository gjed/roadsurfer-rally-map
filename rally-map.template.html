<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roadsurfer Rally map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230066cc'/%3E%3Cpath d='M8 24Q9 9 24 8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='24' r='4' fill='%230066cc' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='24' cy='8' r='4.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --accent: #06c; --link: #067a3f; --muted: #555; --conn: #6a3d9a; }
  html, body { height: 100%; margin: 0; font: 13px system-ui, sans-serif; color: #1a1a1a; }
  body { display: flex; flex-direction: column; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bar { box-sizing: border-box; padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 6px; background: #f4f4f4; border-bottom: 1px solid #ccc; }
  #top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  h1 { margin: 0 auto 0 0; font-size: 15px; }
  #updated { color: var(--muted); white-space: nowrap; }
  #updated:not(:empty)::after { content: " \00b7"; }
  #count { font-weight: 600; white-space: nowrap; }
  #bar input, #bar select, #bar button { font: inherit; color: inherit; padding: 3px 6px; border: 1px solid #767676; border-radius: 4px; background: #fff; }
  #bar button { cursor: pointer; }
  @media (hover: hover) { #bar button:hover { background: #e8e8e8; } }
  #filters[aria-expanded="true"], #mode[aria-pressed="true"] { background: #e6f0fa; border-color: var(--accent); }
  #filters { display: none; }
  #filt { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 10px; }
  #filt fieldset { margin: 0; padding: 0 0 0 5px; border: 0; border-left: 3px solid transparent; }
  #filt legend { padding: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  #filt fieldset.on { border-left-color: var(--accent); }
  #filt fieldset.on legend { color: var(--accent); }
  .f { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .f label { display: flex; gap: 4px; align-items: center; }
  #filt select { width: 130px; }
  #from, #to { width: 104px; }
  #kmin, #kmax { width: 54px; }
  #bar #week { width: 70px; padding: 0; border: 0; accent-color: var(--accent); }
  #bar input.on:not([type="checkbox"]), #bar select.on { border-color: var(--accent); background: #e6f0fa; box-shadow: inset 0 0 0 1px var(--accent); }
  #main { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #map { flex: 1; }
  #empty { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; gap: 10px; background: #fff; padding: 8px 12px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
  #empty[hidden], body.list #empty { display: none; }
  #empty button { font: inherit; padding: 3px 8px; border: 1px solid #767676; border-radius: 4px; background: #fff; cursor: pointer; }
  #list { flex: 1; overflow: auto; display: none; }
  body.list #map { display: none; }
  body.list #list { display: block; }
  #list table, .pop table { border-collapse: collapse; }
  #list table { width: auto; min-width: min(100%, 720px); }
  .pop table { width: 100%; }
  #list th, #list td { padding: 5px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid #e4e4e4; }
  #list th, .pop th { position: sticky; top: 0; background: #fafafa; }
  #list th, .pop th { box-shadow: inset 0 -1px #ccc; }
  .short { display: none; }
  #list th button { font: inherit; font-weight: 600; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; }
  #list th.km, #list td.km, #list th.dd, #list td.dd { text-align: right; }
  #list table.ch td { vertical-align: top; }
  #list table.ch td.lg { white-space: normal; }
  #list caption { display: table-caption; text-align: left; padding: 6px 10px; color: var(--muted); }
  #list .note { margin: 0; padding: 8px 10px; color: var(--muted); }
  /* one leg of a chain: the same markup in the list and in the popup */
  .legs { margin: 0; padding: 0; list-style: none; }
  .legs .hop { margin: 2px 0 2px 9px; padding-left: 10px; border-left: 2px solid #ddd; color: var(--muted); font-size: 12px; }
  .legs .hop.conn { border-left: 2px dotted var(--conn); }
  .legs .no { font-weight: 600; }
  .legs .nm { font-weight: 600; }
  .legs .dt, .legs .nk { color: var(--muted); }
  .legs .nk::before { content: " \00b7  "; }
  #list .legs li { padding: 2px 0; }
  #list .legs .leg { display: grid; grid-template-columns: 20px minmax(12em, 21em) 14em 12.5em 3em; column-gap: 12px; align-items: baseline; }
  #list .legs .dt { display: contents; }
  #list .legs .nk::before { content: none; }
  #list .sub { display: block; color: var(--muted); font-size: 11px; }
  .legno { background: #bf360c; color: #fff; border-radius: 50%; font: 600 11px/18px system-ui, sans-serif; text-align: center; box-shadow: 0 0 0 2px #fff; }
  #gchain { flex: 1 1 100%; }
  #gchain .f { column-gap: 10px; }
  #gchain select { width: auto; }
  #gchain .sd, #gchain .pair { display: flex; align-items: center; gap: 4px 6px; }
  #gchain #cdmin, #gchain #cdmax { width: 54px; }
  #gchain #cdrive { width: 64px; }
  #gchain label:has(input[type="checkbox"].on) { color: var(--accent); font-weight: 600; }
  #bar input[type="checkbox"] { margin: 0; padding: 0; accent-color: var(--accent); }
  @media (hover: hover) { #list tbody tr:hover { background: #eef5ff; } }
  #list tbody tr:focus-within { background: #eef5ff; }
  #list button.go, #list button.reset-all { font: inherit; font-size: 12px; color: inherit; padding: 2px 8px; min-height: 24px; border: 1px solid #767676; border-radius: 4px; background: #fff; cursor: pointer; }
  @media (hover: hover) { #list button.go:hover, #list button.reset-all:hover { background: #e8e8e8; } }
  #list td a, .pop a { color: var(--link); font-weight: 600; }
  .pop { font-size: 13px; }
  .pop h2 { margin: 0 0 2px; font-size: 14px; }
  .pop p { margin: 0 0 6px; color: var(--muted); }
  .pop .trips { max-height: 220px; overflow: auto; }
  .pop th, .pop td { padding: 3px 8px 3px 0; text-align: left; white-space: nowrap; border-bottom: 1px solid #eee; }
  .pop th { font-weight: 600; color: var(--muted); }
  .pop .legs { margin: 6px 0 0; }
  .pop .leg { display: grid; grid-template-columns: 20px 1fr auto; grid-template-areas: "no nm bk" "no dt bk"; column-gap: 8px; padding: 4px 0; border-bottom: 1px solid #eee; }
  .pop .leg .no { grid-area: no; }
  .pop .leg .nm { grid-area: nm; }
  .pop .leg .dt { grid-area: dt; }
  .pop .leg a { grid-area: bk; align-self: center; }
  .pop .note { margin: 6px 0 0; font-size: 12px; }
  .legend { background: #fff; padding: 6px 8px; font-size: 12px; }
  .legend summary { cursor: pointer; font-weight: 600; }
  .legend ul { list-style: none; margin: 4px 0 0; padding: 0; }
  .legend li { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .legend svg { width: 28px; height: 14px; flex: none; }
  .legend .tilde { width: 28px; flex: none; text-align: center; font-weight: 600; }
  .leaflet-control-attribution a { color: #005f87; }
  .leaflet-container path.leaflet-interactive:focus { outline: none; }
  .leaflet-map-pane:has(.leaflet-popup) .leaflet-tooltip-pane { display: none; }
  #map.dim path.leaflet-interactive:not(.hl), #map.dim path.cas { opacity: .3; }
  .hl { filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff); }
  @media (max-width: 700px) {
    #reset, #filters, #mode, #view { order: 1; }
    #count { order: 2; flex-basis: 100%; font-size: 12px; }
    #updated { order: 3; font-size: 11px; }
    #updated:not(:empty)::after { content: none; }
    #filters { display: inline-block; }
    #filt { display: none; max-height: 60vh; overflow: auto; flex-direction: column; align-items: stretch; gap: 8px; padding-top: 2px; }
    body.filt #filt { display: flex; }
    #bar input, #bar select, #bar button { font-size: 16px; }
    #filt select { width: auto; flex: 1 1 100%; min-width: 0; }
    #bar #week { flex: 1; height: 28px; }
    #from, #to { flex: 1; min-width: 0; }
    .f label { flex-basis: 100%; }
    #list table { font-size: 12px; }
    .brand { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .iso { display: none; }
    .short { display: inline; }
    #list table, #list tbody { display: block; width: auto; min-width: 0; }
    #list thead { display: block; position: sticky; top: 0; z-index: 1; background: #fafafa; box-shadow: inset 0 -1px #ccc; }
    #list thead tr { display: flex; gap: 12px; padding: 4px 10px; }
    #list thead th:not([aria-sort]) { display: none; }
    #list th { position: static; padding: 0; border: 0; box-shadow: none; }
    #list tbody tr { display: grid; grid-template-columns: auto auto 1fr auto auto; grid-template-areas: "s e k m b" "f f f m b" "t t t m b"; column-gap: 8px; padding: 6px 10px; border-bottom: 1px solid #e4e4e4; }
    #list table.hp tbody tr { grid-template-columns: auto auto 1fr auto auto auto; grid-template-areas: "s e k p m b" "f f f f m b" "t t t t m b"; }
    #list tbody td { padding: 0; border: 0; white-space: normal; }
    #list td.ds { grid-area: s; }
    #list td.de { grid-area: e; }
    #list td.km { grid-area: k; }
    #list td.pr { grid-area: p; }
    #list td.from { grid-area: f; }
    #list td.to { grid-area: t; }
    #list td.m { grid-area: m; align-self: center; }
    #list td.bk { grid-area: b; align-self: center; }
    #list table.ch tbody tr { grid-template-columns: auto auto auto 1fr auto; grid-template-areas: "s e d k m" "l l l l l"; }
    #list table.ch td.dd { grid-area: d; text-align: left; }
    #list table.ch td.dd .n::after { content: " days"; }
    #list .sub { display: inline; }
    #list .sub::before { content: " ("; }
    #list .sub::after { content: ")"; }
    #list caption { display: block; }
    #list table.ch td.km { text-align: left; }
    #list table.ch td.lg { grid-area: l; margin-top: 4px; }
    #list table.ch td.m { align-self: start; }
    #list .legs li { padding: 2px 0 4px; }
    #list .legs .leg { grid-template-columns: 20px 1fr auto; grid-template-areas: "no nm bk" "no dt bk"; column-gap: 8px; }
    #list .legs .no { grid-area: no; }
    #list .legs .nm { grid-area: nm; }
    #list .legs .dt { display: block; grid-area: dt; }
    #list .legs .leg a { grid-area: bk; align-self: center; }
    #list .legs .nk::before { content: " \00b7  "; }
    #gchain .f { display: grid; grid-template-columns: max-content 1fr; gap: 6px 8px; align-items: center; }
    #gchain .f > label { display: contents; }
    #gchain .sd, #gchain .f > label.chk { grid-column: 1 / -1; }
    #gchain .sd { flex-wrap: wrap; }
    #gchain .sd label, #gchain .sd select { flex: 0 0 auto; }
    #gchain .pair > input { flex: 1; min-width: 0; width: auto; }
    #gchain #cdrive { width: auto; }
    #gchain select, #gchain input:not([type="checkbox"]) { min-height: 44px; box-sizing: border-box; }
    #gchain label.chk, #gchain .sd label { display: flex; align-items: center; min-height: 44px; }
    #list td.de::before { content: "\2013  "; content: "\2013  " / ""; }
    #list td.to::before { content: "\2192  "; content: "\2192  " / ""; color: var(--muted); }
    #list td.km::after { content: " km"; }
    #list tbody tr.none { display: block; padding: 10px; }
  }
  /* grow the tap area, not the rows */
  @media (pointer: coarse) {
    #list td a, .pop td a { display: inline-block; padding: 6px 8px; margin: -6px -8px; }
    #list button.go { min-height: 28px; }
  }
</style>
</head>
<body>
<header id="bar">
  <div id="top">
    <h1><span class="brand">roadsurfer </span>Rally map</h1>
    <span id="updated"></span>
    <span id="count" aria-live="polite" aria-atomic="true"></span>
    <button id="reset" hidden>Reset</button>
    <button id="filters" aria-expanded="false" aria-controls="filt">Filters</button>
    <button id="mode" aria-pressed="false" title="Longer trips: 2–3 rallies back to back">Chains</button>
    <button id="view">List</button>
  </div>
  <div id="filt">
    <fieldset id="gchain" hidden><legend>Chain options</legend><div class="f">
      <label>Legs <select id="cn"><option value="2">2</option><option value="3">3</option><option value="2-3">2 or 3</option></select></label>
      <div class="sd">
        <label class="chk"><input type="checkbox" id="cs" checked> Same day</label>
        <label><span id="cgc">or up to</span> <select id="cg" aria-label="Most rest days between legs"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select> rest days</label>
      </div>
      <label>Next pick-up within <select id="ck"><option value="0">same station</option><option value="25">~25 km</option><option value="50">~50 km</option><option value="100">~100 km</option><option value="150">~150 km</option><option value="250">~250 km</option></select></label>
      <label>Trip days <span class="pair"><input type="number" id="cdmin" min="1" step="1" inputmode="numeric" placeholder="any" aria-label="Shortest trip in days"> &ndash; <input type="number" id="cdmax" min="1" step="1" inputmode="numeric" placeholder="any" aria-label="Longest trip in days"></span></label>
      <label>Max total km <input type="number" id="cdrive" min="0" step="50" placeholder="any"></label>
      <label class="chk" title="Ends within the next pick-up distance of the first pick-up"><input type="checkbox" id="cr"> Round trip</label>
    </div></fieldset>
    <fieldset id="gdate"><legend>Start date</legend><div class="f">
      <input type="date" id="from" aria-label="Earliest start date"> &ndash;
      <input type="date" id="to" aria-label="Latest start date">
      <label>Week <input type="range" id="week" min="0" max="0" value="0" aria-valuetext="all dates"></label>
    </div></fieldset>
    <fieldset id="gkm"><legend>Distance</legend><div class="f">
      <input type="number" id="kmin" min="0" step="50" aria-label="Minimum distance in km"> &ndash;
      <input type="number" id="kmax" min="0" step="50" aria-label="Maximum distance in km"> km
    </div></fieldset>
    <fieldset id="gfrom"><legend>Pick-up</legend><div class="f">
      <select id="fcc" aria-label="Pick-up country"></select>
      <select id="fst" aria-label="Pick-up station"></select>
    </div></fieldset>
    <fieldset id="gto"><legend>Return</legend><div class="f">
      <select id="tcc" aria-label="Return country"></select>
      <select id="tst" aria-label="Return station"></select>
    </div></fieldset>
  </div>
</header>
<main id="main">
  <div id="map" role="region" aria-label="Route map"></div>
  <div id="empty" role="status" hidden><span id="empty-msg"></span><button id="empty-reset">Reset filters</button></div>
  <div id="list" role="region" aria-label="Trip list"></div>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
const DATA = /*DATA*/[];
const SCAN = /*SCAN*/null;
const RELEASE = /*RELEASE*/null;
const COL = '#06c', HOT = '#bf360c', STN = '#003d7a', CONN = '#6a3d9a';
let chainMode = false;  // chain mode shows chains of rallies instead of single trips
const map = L.map('map', { maxZoom: 16 });
// the toolbar changes height (selects fill, the slider moves): keep Leaflet's cached size current
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
map.createPane('labels').style.cssText = 'z-index: 420; pointer-events: none';  // city names above the routes
map.createPane('stations').style.zIndex = 450;  // above the route lines, so a raised line never covers a station
// grey base: the street map's blue sea and yellow motorways are the routes' own colours
const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(esri + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles © Esri — Esri, HERE, Garmin' }).addTo(map);
L.tileLayer(esri + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, pane: 'labels' }).addTo(map);
const layer = L.featureGroup().addTo(map);
const weight = n => Math.min(1.5 + n * .7, 5);
const opacity = n => Math.min(.35 + n * .1, .8);
// chain mode draws up to 200 chains: thinner and fainter, so the overview stays readable
const chainWeight = n => Math.min(1 + n * .3, 4);
const chainOpacity = n => Math.min(.25 + n * .05, .7);
const legend = L.control({ position: 'bottomleft' });
let legendList;
function legendItems() {
  const line = (w, op, col, dash) => `<svg viewBox="0 0 28 14" aria-hidden="true"><path d="M2 7H26" stroke="${col}" stroke-width="${w}" stroke-opacity="${op}"${dash ? ` stroke-dasharray="${dash}" stroke-linecap="round"` : ''}/></svg>`;
  const dot = `<svg viewBox="0 0 28 14" aria-hidden="true"><circle cx="14" cy="7" r="4" stroke="${STN}" stroke-width="2" fill="#fff"/></svg>`;
  const what = chainMode ? 'chain' : 'trip';
  return (chainMode ? `<li>${line(chainWeight(1), chainOpacity(1), COL)} leg of 1 chain</li><li>${line(chainWeight(10), chainOpacity(10), COL)} 10 or more chains</li>`
    : `<li>${line(weight(1), opacity(1), COL)} 1 trip on this route</li><li>${line(weight(5), opacity(5), COL)} 5 or more trips</li>`) +
    (chainMode ? `<li>${line(3, 1, CONN, '1 6')} connection to the next pick-up (train, bus)</li>` : '') +
    `<li>${line(2.5, 1, HOT)} selected ${chainMode ? 'chain' : 'route'}</li><li>${dot} station: click for ${what}s ${chainMode ? 'starting' : 'from'} here</li>` +
    // ~ marks a distance that was not routed: straight line x 1.3
    (DATA.some(r => dist(r).est) || (chainMode && +document.getElementById('ck').value > 0) ? '<li><span class="tilde" aria-hidden="true">~</span> estimated distance, not routed</li>' : '');
}
legend.onAdd = () => {
  const d = L.DomUtil.create('details', 'legend leaflet-bar');
  d.innerHTML = '<summary>Legend</summary><ul></ul>';
  legendList = d.lastChild;
  legendList.innerHTML = legendItems();
  d.open = matchMedia('(min-width: 701px)').matches;
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.disableScrollPropagation(d);
  return d;
};
legend.addTo(map);

function arc(a, b, n = 40) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const cx = mx - (b[1] - a[1]) * 0.2, cy = my + (b[0] - a[0]) * 0.2;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0], u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
  }
  return pts;
}

// fallback for records without a routed km: great-circle distance x 1.3
function roadKm(a, b) {
  const R = Math.PI / 180, dLa = (b.latitude - a.latitude) * R, dLo = (b.longitude - a.longitude) * R;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.latitude * R) * Math.cos(b.latitude * R) * Math.sin(dLo / 2) ** 2;
  return Math.round(12742 * Math.asin(Math.sqrt(h)) * 1.3 / 10) * 10;
}
// the scanner stores the routed km in the record; km_estimated marks its own x 1.3 fallback
function dist(r) {
  if (typeof r.km === 'number' && isFinite(r.km)) return { km: r.km, est: r.km_estimated === true };
  return { km: roadKm(r.from, r.to), est: true };
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const day = s => Date.parse(s + 'T00:00:00Z');
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const shorts = new Map();  // formatting a date is slow, and a list shows the same few hundred
const short = s => { if (!shorts.has(s)) shorts.set(s, new Date(day(s)).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })); return shorts.get(s); };
const place = s => `${s.name}, ${s.cc}`;
// the arrow is read as "rightwards arrow" otherwise
const ARROW = '<span aria-hidden="true">\u2192</span><span class="sr"> to </span>';

// ---- chains: pure computation, no DOM and no request --------------------------------------------
// A record is a WINDOW (start..end): the booking page accepts any pick-up and return inside it, up to
// 7 nights, and prices it flat. A leg is therefore a pick-up day p and a return day q with start <= p < q <= end,
// so consecutive legs can be made to line up. Only days on which the data itself shows a pick-up or return
// (the start or end of some offer) are used: that skips Sundays and holidays without a calendar.
// Leg N+1 starts at p' with q + gmin <= p' <= q + gmax, at a station within conn km of where leg N ended (0: the same one).
// Per chain (a sequence of routes) the dates kept are the best itinerary: most nights on the road, then fewest
// rest days, then the earliest start. No station is a pick-up twice in a chain.
const NIGHTS = 7;
const dn = s => Date.parse(s + 'T00:00:00Z') / 864e5;  // day number
const OPEN = new Set([...DATA.map(r => dn(r.start)), ...DATA.map(r => dn(r.end))]);
const legKey = r => r.from.name + '>' + r.to.name;

// offers: the records to chain; open: the set of bookable day numbers; o: { lmin, lmax, gmin, gmax, conn, lo, hi, dmin, dmax,
// drive, round } where lmin..lmax are the legs, gmin..gmax the days between a return and the next pick-up, lo..hi the allowed
// first pick-up days, dmin..dmax the trip days, drive the most km driven and round asks that the last return is near the first

    if (i && !c.hops[i - 1].same) drawHop(picked, c.legs[i - 1].r.to, l.r.from, { ...hot, weight: 4 });
    L.marker(pts[20], { pane: 'stations', interactive: false, keyboard: false, icon: L.divIcon({ className: 'legno', html: String(i + 1), iconSize: [18, 18] }) }).addTo(picked);
    stations.set(l.r.from.name, l.r.from).set(l.r.to.name, l.r.to);
  });
  // the others are dimmed, so the chain's own stations are drawn again on top
  for (const s of stations.values()) L.circleMarker([s.latitude, s.longitude], { pane: 'stations', radius: 5, weight: 2, color: HOT, fillColor: '#fff', fillOpacity: 1, className: 'hl', interactive: false }).addTo(picked);
  $('map').classList.add('dim');
  // no autoPan: showRoute fits the map around the popup instead
  first.bindPopup(pop, { maxWidth: Math.min(340, innerWidth - 80), minWidth: Math.min(280, innerWidth - 100), autoPan: false })
    .on('popupclose', () => { fromRow = null; })
    .on('popupopen', () => { fromRow = null; });
  picked.eachLayer(l => l.getElement().setAttribute('tabindex', '-1'));
  lines.set(key, first);
  return first;
}

function clearPicked() {
  picked.clearLayers();
  $('map').classList.remove('dim');
  lines.clear();
}

let fromRow = null;  // the list button that opened the current popup, to go back to it
function showRoute(btn, keyboard) {
  const line = lines.get(btn.dataset.key) || (chainMode ? drawChain(btn.dataset.key) : null);
  if (!line) return;
  setView(false);
  if (chainMode) {
    // the popup sits on the chain's northern edge and the chain is fitted below it
    const b = picked.getBounds();
    line.openPopup(L.latLng(b.getNorth(), b.getCenter().lng));
    map.fitBounds(b, { paddingTopLeft: [40, line.getPopup().getElement().offsetHeight + 70], paddingBottomRight: [40, 30], maxZoom: 8, animate: false });
    line.getPopup().update();
  } else {
    map.fitBounds(line.getBounds(), { padding: [40, 40], maxZoom: 8, animate: false });
    line.openPopup();
  }
  fromRow = { btn, line };
  // the focused button is hidden now: keep keyboard users in the popup
  if (keyboard) line.getPopup().getElement().querySelector('a').focus();
}

// One arc per route (from -> to); all matching dates are listed in its popup. Returns what the common tail needs.
function drawTrips() {
  const routes = new Map(), stations = new Map();
  for (const r of DATA) {
    if (!passes(r)) continue;
    shown.push(r);
    const key = routeKey(r);
    if (!routes.has(key)) routes.set(key, { from: r.from, to: r.to, trips: [] });
    routes.get(key).trips.push(r);
  }
  for (const [key, g] of routes) {
    g.trips.sort((x, y) => x.start.localeCompare(y.start));
    const a = [g.from.latitude, g.from.longitude], b = [g.to.latitude, g.to.longitude];
    const t = g.trips, N = t.length, d = dist(t[0]);
    const head = `${esc(place(g.from))} ${ARROW} ${esc(place(g.to))}`;
    const rows = t.map(r => `<tr><td>${esc(r.start)}</td><td>${esc(r.end)}</td>${hasPrice ? `<td>${r.price ? esc(r.price) : ''}</td>` : ''}` +
      `<td><a href="${esc(r.link)}" target="_blank" rel="noopener" aria-label="Book ${esc(short(r.start))}">Book</a></td></tr>`).join('');
    const pop = `<div class="pop"><h2>${head}</h2><p>${d.est ? `~${d.km} km (estimated)` : `${d.km} km by road`} \u00b7 ${N} trip${N > 1 ? 's' : ''}</p>` +
      `<div class="trips"><table><thead><tr><th>Start</th><th>End</th>${hasPrice ? '<th>Price</th>' : ''}<th><span class="sr">Booking</span></th></tr></thead>` +
      `<tbody>${rows}</tbody></table></div></div>`;
    const tip = `${head}<br>${d.est ? '~' : ''}${d.km} km${d.est ? ' (estimated)' : ''} \u00b7 ${N} trip${N > 1 ? 's' : ''}: ${esc(t[0].start)}${N > 1 ? ' \u2026 ' + esc(t[N - 1].start) : ''}`;
    const base = { color: COL, weight: weight(N), opacity: opacity(N) };
    const hot = { color: HOT, weight: base.weight + 2, opacity: 1 };
    const line = L.polyline(arc(a, b), base).addTo(layer).bindPopup(pop).bindTooltip(tip, { sticky: true });
    lines.set(key, line);
    const style = (s, on) => { line.setStyle(s); line.getElement().classList.toggle('hl', on); };
    // hot while hovered or while its popup is open. A tap fires mouseover but no mouseout, and Leaflet fires
    // popupclose while isPopupOpen() is still true, so popupclose resets unconditionally.
    line.on('mouseover popupopen', () => { style(hot, true); line.bringToFront(); })
      .on('mouseout', () => { if (!line.isPopupOpen()) style(base, false); })
      .on('popupclose', () => { style(base, false); fromRow = null; })
      // any popup opened here is from the map; showRoute sets fromRow once openPopup returns
      .on('popupopen', () => { fromRow = null; });
    for (const [s, k] of [[g.from, 'dep'], [g.to, 'arr']]) {
      if (!stations.has(s.name)) stations.set(s.name, { s, dep: 0, arr: 0 });
      stations.get(s.name)[k] += N;
    }
  }
  return { stations, routes: routes.size, n: shown.length };
}

// Every leg of the listed chains is drawn once, weighted by how many of them use it; connections are dotted.
function drawChains() {
  chains = chainList().filter(c => endsPass(c));
  sortChains();
  const legs = new Map(), hops = new Map(), stations = new Map();
  const at = s => { if (!stations.has(s.name)) stations.set(s.name, { s, dep: 0, arr: 0 }); return stations.get(s.name); };
  const bump = (m, key, v) => { if (!m.has(key)) m.set(key, { ...v, n: 0 }); m.get(key).n++; };
  for (const c of chains.slice(0, CHAIN_ROWS)) {
    c.legs.forEach((l, i) => {
      bump(legs, routeKey(l.r), { r: l.r });
      at(l.r.from); at(l.r.to);
      if (i && !c.hops[i - 1].same) bump(hops, c.legs[i - 1].r.to.name + '>' + l.r.from.name, { a: c.legs[i - 1].r.to, b: l.r.from, h: c.hops[i - 1] });
    });
    at(c.legs[0].r.from).dep++;
    at(c.legs[c.legs.length - 1].r.to).arr++;
  }
  for (const g of legs.values()) {
    const d = dist(g.r);
    L.polyline(arc([g.r.from.latitude, g.r.from.longitude], [g.r.to.latitude, g.r.to.longitude]), { color: COL, weight: chainWeight(g.n), opacity: chainOpacity(g.n) }).addTo(layer)
      .bindTooltip(`${esc(place(g.r.from))} ${ARROW} ${esc(place(g.r.to))}<br>${d.est ? '~' : ''}${d.km} km${d.est ? ' (estimated)' : ''} \u00b7 in ${count(g.n, 'chain')}`, { sticky: true });
  }
  for (const g of hops.values()) {
    drawHop(layer, g.a, g.b, { color: CONN, weight: 3, opacity: 1 })
      .bindTooltip(`Connection: ${esc(g.a.name)} ${ARROW} ${esc(g.b.name)}<br>~${g.h.km} km (estimated) \u00b7 in ${count(g.n, 'chain')}`, { sticky: true });
  }
  return { stations, routes: legs.size, n: chains.length };
}

function render() {
  fillSelects();
  layer.clearLayers();
  clearPicked();
  legendList.innerHTML = legendItems();
  shown = [];
  const { stations, routes, n } = chainMode ? drawChains() : drawTrips();
  // one marker per station: a stack of per-route markers would open an arbitrary route on click
  for (const [name, g] of stations) {
    const on = eff.fst === name;
    // arrival only: the pick-up dropdown has no such option, so the click does nothing
    const hint = g.dep ? `<br>${on ? 'Click to show all pick-ups' : `Click to show ${chainMode ? 'chains starting' : 'trips from'} here`}` : '';
    const tally = chainMode ? `${count(g.dep, 'chain')} starting \u00b7 ${count(g.arr, 'chain')} ending` : `${count(g.dep, 'departure')} \u00b7 ${count(g.arr, 'arrival')}`;
    L.circleMarker([g.s.latitude, g.s.longitude], { pane: 'stations', radius: on ? 6 : 4, weight: 2, color: STN, fillColor: on ? STN : '#fff', fillOpacity: 1 })
      .addTo(layer)
      .bindTooltip(`${esc(name)}, ${esc(g.s.cc)}<br>${tally}${hint}`)
      .on('click', () => {
        if (!g.dep) return;
        sel.fst = on ? '' : name;
        render();
      });
  }
  // whole-number zoom: fractional zoom leaves seams and shrinks labels on raster tiles
  if (!fitted) {
    fitted = true;
    if (stations.size) map.fitBounds(L.latLngBounds([...stations.values()].map(g => [g.s.latitude, g.s.longitude])), { padding: [16, 16], animate: false });
    else map.setView([50, 9], 5);
  }
  // Chrome puts every clickable SVG path in the tab order; keyboard users reach routes via the list
  layer.eachLayer(l => l.getElement().setAttribute('tabindex', '-1'));
  $('count').textContent = chainMode ? (n > CHAIN_ROWS ? `Showing ${CHAIN_ROWS} of ${n.toLocaleString('en-GB')} chains` : count(n, 'chain')) : routes + ' routes \u00b7 ' + n + ' of ' + DATA.length + ' trips';
  $('empty').hidden = n > 0;
  $('empty-msg').textContent = !DATA.length ? 'No rally trips are on offer right now.' : chainMode ? `No chains match${chainTry() ? `. Try: ${chainTry()}, or reset the filters.` : ' these filters.'}` : 'No trips match the filters.';
  $('empty-reset').hidden = !DATA.length;
  renderList();
  markActive();
}

$('week').oninput = () => {
  const k = +$('week').value, s = day(min) + (k - 1) * 7 * 864e5;
  $('from').value = k ? iso(s) : min;
  $('to').value = k ? iso(Math.min(s + 6 * 864e5, day(max))) : max;
  $('week').setAttribute('aria-valuetext', k ? 'week of ' + short($('from').value) : 'all dates');
  render();
};
for (const k in FILTERS) $(k).onchange = () => { sel[k] = $(k).value; render(); };
['kmin', 'kmax'].forEach(id => $(id).oninput = render);
// typed dates no longer match the week slider
['from', 'to'].forEach(id => $(id).oninput = () => {
  $('week').value = 0;
  $('week').setAttribute('aria-valuetext', 'custom dates');
  render();
});
function setChainOptions(v) {
  for (const id in v) $(id)[$(id).type === 'checkbox' ? 'checked' : 'value'] = v[id];
  // Same day off means a break of 1 to N days: 0 rest days can no longer be picked
  const same = $('cs').checked;
  $('cg').options[0].disabled = !same;
  if (!same && +$('cg').value < 1) $('cg').value = '1';
  $('cgc').textContent = same ? 'or up to' : '1 to';
}
$('reset').onclick = () => {
  for (const k in FILTERS) sel[k] = '';
  $('from').value = min; $('to').value = max; $('week').value = 0; $('kmin').value = $('kmax').value = '';
  $('week').setAttribute('aria-valuetext', 'all dates');
  setChainOptions({ cn: '2', cs: true, cg: '0', ck: '0', cdmin: '', cdmax: '', cdrive: '', cr: false });
  render();
  $('view').focus();  // Reset hides itself: do not leave keyboard focus on it
};
$('empty-reset').onclick = () => $('reset').click();
$('filters').onclick = () => {
  const open = document.body.classList.toggle('filt');
  $('filters').setAttribute('aria-expanded', open);
};
$('view').onclick = () => setView(!document.body.classList.contains('list'));
$('mode').onclick = () => {
  chainMode = !chainMode;
  fromRow = null;
  $('mode').setAttribute('aria-pressed', chainMode);
  $('gchain').hidden = !chainMode;
  if (chainMode && matchMedia('(max-width: 700px)').matches) {  // on a phone the options are hidden with the other filters: open them at once
    document.body.classList.add('filt');
    $('filters').setAttribute('aria-expanded', true);
    $('filt').scrollTop = 0;
  }
  // the filters mean something else for chains
  for (const [id, trips, chain] of [['gkm', 'Distance', 'Distance per leg'], ['gfrom', 'Pick-up', 'Chain starts at'], ['gto', 'Return', 'Chain ends at']]) $(id).querySelector('legend').textContent = chainMode ? chain : trips;
  $('list').setAttribute('aria-label', chainMode ? 'Chain list' : 'Trip list');
  render();
};
$('cs').oninput = () => { setChainOptions({}); render(); };
CHAIN_IDS.filter(id => id !== 'cs').forEach(id => $(id).oninput = render);
$('list').onclick = e => {
  const b = e.target.closest('button[data-sort]');
  if (b) {
    const s = sorting();
    s.dir = b.dataset.sort === s.key ? -s.dir : 1;
    s.key = b.dataset.sort;
    chainMode ? render() : renderList();  // the order decides which chains the map draws
    $('list').querySelector(`[data-sort="${s.key}"]`).focus();  // the header was redrawn
    return;
  }
  if (e.target.closest('button.reset-all')) return $('reset').click();
  const m = e.target.closest('button[data-key]');
  if (m) showRoute(m, e.detail === 0);  // detail 0: activated with the keyboard
};
// Leaflet closes popups on Escape only while the map itself has focus.
// A popup opened from the list goes back to the list: its button is hidden while the map shows.
const back = () => fromRow && fromRow.line.isPopupOpen() && document.body.contains(fromRow.btn) ? fromRow.btn : null;
$('map').addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !e.target.closest('.leaflet-popup')) return;
  const btn = back();
  map.closePopup();
  if (chainMode) clearPicked();
  if (btn) { setView(true); btn.focus(); } else $('map').focus();
});
// Escape also clears the chain after its popup was closed with the x button
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && chainMode && picked.getLayers().length && !document.body.classList.contains('list')) clearPicked();
});
// the chain opened from the list stays until Escape, a click on the map or another change
map.on('click', () => { if (chainMode) clearPicked(); });
render();
</script>
</body>
</html>
