<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>roadsurfer Rally map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230066cc'/%3E%3Cpath d='M8 24Q9 9 24 8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='24' r='4' fill='%230066cc' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='24' cy='8' r='4.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { box-sizing: border-box; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: #f4f4f4; border-bottom: 1px solid #ccc; }
  #map { flex: 1; }
  #bar label { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  #bar select { max-width: 170px; }
  #updated { margin-left: auto; font-weight: 600; white-space: nowrap; }
  #count { font-weight: 600; }
  #reset, #view { cursor: pointer; }
  .a a { color: #0b6; }
  #list { flex: 1; overflow: auto; display: none; }
  body.list #map { display: none; }
  body.list #list { display: block; }
  #list table { border-collapse: collapse; width: 100%; }
  #list th, #list td { padding: 5px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid #e4e4e4; }
  #list th { position: sticky; top: 0; background: #fafafa; }
  #list th button { font: inherit; font-weight: 600; border: 0; padding: 0; background: none; cursor: pointer; }
  #list td.km { text-align: right; }
  #list tbody tr { cursor: pointer; }
  #list tbody tr:hover, #list tbody tr:focus { background: #eef5ff; }
  #list td a { color: #0b6; }
  #release { padding: 2px 12px; font-size: 11px; color: #666; background: #f4f4f4; border-top: 1px solid #ccc; }
  #release:empty { display: none; }
  @media (max-width: 600px) {
    #list table { font-size: 12px; }
    #list th, #list td { padding: 4px 3px; }
    #list td.st, #list td.d { white-space: normal; }
  }
</style>
</head>
<body>
<div id="bar">
  <label>Start <input type="date" id="from"></label>
  <label>to <input type="date" id="to"></label>
  <label>Week <input type="range" id="week" min="0" max="0" value="0" style="width:140px"></label>
  <label>Distance <input type="number" id="kmin" min="0" step="50" style="width:65px"> to <input type="number" id="kmax" min="0" step="50" style="width:65px"> km</label>
  <label>From country <select id="fcc"></select></label>
  <label>From <select id="fst"></select></label>
  <label>To country <select id="tcc"></select></label>
  <label>To <select id="tst"></select></label>
  <button id="reset">Reset</button>
  <button id="view">List</button>
  <span id="updated"></span>
  <span id="count"></span>
</div>
<div id="map"></div>
<div id="list"></div>
<footer id="release"></footer>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
const DATA = /*DATA*/[];
const SCAN = /*SCAN*/null;
const RELEASE = /*RELEASE*/null;
const map = L.map('map').setView([50.0, 9.0], 5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles © Esri' }).addTo(map);
const layer = L.layerGroup().addTo(map);

function arc(a, b, n = 40) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const cx = mx - (b[1] - a[1]) * 0.2, cy = my + (b[0] - a[0]) * 0.2;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0], u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
  }
  return pts;
}

// estimate: great-circle distance x 1.3 to approximate driving distance
function roadKm(a, b) {
  const R = Math.PI / 180, dLa = (b.latitude - a.latitude) * R, dLo = (b.longitude - a.longitude) * R;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.latitude * R) * Math.cos(b.latitude * R) * Math.sin(dLo / 2) ** 2;
  return Math.round(12742 * Math.asin(Math.sqrt(h)) * 1.3 / 10) * 10;
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const day = s => Date.parse(s + 'T00:00:00Z');
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const min = DATA.map(r => r.start).sort()[0], max = DATA.map(r => r.end).sort().pop();
if (min) { $('from').value = min; $('to').value = max; }
const kms = DATA.map(r => roadKm(r.from, r.to));
if (kms.length) { $('kmin').placeholder = Math.min(...kms); $('kmax').placeholder = Math.max(...kms); }
$('week').max = min ? Math.ceil((day(max) - day(min)) / 864e5 / 7) : 0;

// scan metadata is absent in pages rendered from older data files: show nothing
const done = SCAN && typeof SCAN.finished_at === 'string' ? Date.parse(SCAN.finished_at) : NaN;
if (!isNaN(done)) {
  $('updated').textContent = 'updated ' + new Date(done).toISOString().slice(0, 16).replace('T', ' ') + ' UTC \u00b7';
  $('updated').title = `scan finished ${SCAN.finished_at} \u00b7 ${SCAN.offers} offers \u00b7 ${SCAN.requests} requests, ${SCAN.failed} failed`;
}

// release tag, null when rendered without --release: the footer stays empty and hidden
if (typeof RELEASE === 'string' && RELEASE) {
  const a = document.createElement('a');
  a.href = 'https://github.com/gjed/roadsurfer-rally-map/releases/tag/' + encodeURIComponent(RELEASE);
  a.textContent = RELEASE;
  $('release').append('release ', a);
}

// Faceted filters: each dropdown only offers values that still have offers
// under every OTHER active filter, so incompatible combinations can't be picked.
const FILTERS = {
  fcc: r => r.from.cc, fst: r => r.from.name,
  tcc: r => r.to.cc,   tst: r => r.to.name,
};
const sel = {};  // current selections, '' = any

function passes(r, skip) {
  if (day(r.start) < day($('from').value) || day(r.start) > day($('to').value)) return false;
  const km = roadKm(r.from, r.to);
  if (km < +$('kmin').value || ($('kmax').value !== '' && km > +$('kmax').value)) return false;
  for (const k in FILTERS) if (k !== skip && sel[k] && FILTERS[k](r) !== sel[k]) return false;
  return true;
}

function fillSelects() {
  for (const k in FILTERS) {
    const counts = new Map();
    for (const r of DATA) if (passes(r, k)) counts.set(FILTERS[k](r), (counts.get(FILTERS[k](r)) || 0) + 1);
    if (sel[k] && !counts.has(sel[k])) sel[k] = '';  // selection became impossible -> clear it
    const el = $(k);
    el.innerHTML = '<option value="">any (' + [...counts.values()].reduce((a, b) => a + b, 0) + ')</option>' +
      [...counts].sort((a, b) => a[0].localeCompare(b[0]))
        .map(([v, n]) => `<option value="${esc(v)}"${v === sel[k] ? ' selected' : ''}>${esc(v)} (${n})</option>`).join('');
  }
}

// the list shows the same trips as the map: render() hands it what passes()
const hasPrice = DATA.some(r => r.price);
const SORTS = { start: r => r.start, end: r => r.end, km: r => roadKm(r.from, r.to) };
let shown = [], sortKey = 'start', sortDir = 1;
const lines = new Map();  // route key -> arc, to open a route from the list
const routeKey = r => r.from.name + '>' + r.to.name;

function renderList() {
  const f = SORTS[sortKey];
  shown.sort((x, y) => {
    const a = f(x), b = f(y);
    return (a < b ? -1 : a > b ? 1 : 0) * sortDir || x.start.localeCompare(y.start) || x.from.name.localeCompare(y.from.name);
  });
  const th = (k, t) => `<th><button data-sort="${k}">${t}${k === sortKey ? (sortDir > 0 ? ' \u25b2' : ' \u25bc') : ''}</button></th>`;
  // narrow screens may wrap a date after its year
  const d = s => esc(s).replace('-', '-<wbr>');
  const rows = shown.map(r => `<tr tabindex="0" data-key="${esc(routeKey(r))}"><td class="d">${d(r.start)}</td><td class="d">${d(r.end)}</td>` +
    `<td class="st">${esc(r.from.name)} (${esc(r.from.cc)})</td><td class="st">${esc(r.to.name)} (${esc(r.to.cc)})</td>` +
    `<td class="km">${roadKm(r.from, r.to)}</td>${hasPrice ? `<td>${r.price ? esc(r.price) : ''}</td>` : ''}` +
    `<td><a href="${esc(r.link)}" target="_blank" rel="noopener">book</a></td></tr>`).join('');
  $('list').innerHTML = `<table><thead><tr>${th('start', 'Start')}${th('end', 'End')}<th>From</th><th>To</th>${th('km', 'km')}` +
    `${hasPrice ? '<th>Price</th>' : ''}<th></th></tr></thead><tbody>` +
    (rows || `<tr><td colspan="${hasPrice ? 7 : 6}">No trips match the filters.</td></tr>`) + '</tbody></table>';
}

function setView(list) {
  document.body.classList.toggle('list', list);
  $('view').textContent = list ? 'Map' : 'List';
  if (!list) map.invalidateSize();
}

function showRoute(tr) {
  const line = lines.get(tr.dataset.key);
  if (!line) return;
  setView(false);
  map.fitBounds(line.getBounds(), { padding: [40, 40], maxZoom: 8, animate: false });
  line.openPopup();
}

function render() {
  fillSelects();
  layer.clearLayers();
  lines.clear();
  shown = [];
  // one arc per route (from -> to); all matching dates are listed in its popup
  const routes = new Map();
  let n = 0;
  for (const r of DATA) {
    if (!passes(r)) continue;
    n++;
    shown.push(r);
    const key = routeKey(r);
    if (!routes.has(key)) routes.set(key, { from: r.from, to: r.to, trips: [] });
    routes.get(key).trips.push(r);
  }
  for (const [key, g] of routes) {
    g.trips.sort((x, y) => x.start.localeCompare(y.start));
    const a = [g.from.latitude, g.from.longitude], b = [g.to.latitude, g.to.longitude];
    const t = g.trips, N = t.length, km = roadKm(g.from, g.to);
    const head = `${esc(g.from.name)} (${esc(g.from.cc)}) \u2192 ${esc(g.to.name)} (${esc(g.to.cc)})`;
    const rows = t.map(r => `<li>${r.start} \u2192 ${r.end}${r.price ? ' \u00b7 ' + esc(r.price) : ''} \u00b7 <a href="${esc(r.link)}" target="_blank">book</a></li>`).join('');
    const pop = `<div class="a"><b>${head}</b><br>~${km} km by road \u00b7 ${N} trip${N > 1 ? 's' : ''}<ul style="margin:4px 0 0;padding-left:18px;max-height:220px;overflow:auto">${rows}</ul></div>`;
    const tip = `${head}<br>~${km} km \u00b7 ${N} trip${N > 1 ? 's' : ''}: ${t[0].start}${N > 1 ? ' \u2026 ' + t[N - 1].start : ''}`;
    const col = '#06c';
    const line = L.polyline(arc(a, b), { color: col, weight: Math.min(2 + N, 7), opacity: .75 }).addTo(layer).bindPopup(pop).bindTooltip(tip, { sticky: true });
    lines.set(key, line);
    line.on('mouseover', () => line.setStyle({ opacity: 1, color: '#e60' })).on('mouseout', () => line.setStyle({ opacity: .75, color: col }));
    L.circleMarker(a, { radius: 4, color: col, fillColor: '#fff', fillOpacity: 1 }).addTo(layer).bindPopup(pop).bindTooltip(tip);
    L.circleMarker(b, { radius: 6, color: col, fillColor: col, fillOpacity: 1 }).addTo(layer).bindPopup(pop).bindTooltip(tip);
  }
  $('count').textContent = routes.size + ' routes \u00b7 ' + n + ' / ' + DATA.length + ' trips';
  renderList();
}

$('week').oninput = () => {
  const s = day(min) + $('week').value * 7 * 864e5;
  $('from').value = iso(Math.max(s, day(min)));
  $('to').value = iso(Math.min(s + 6 * 864e5, day(max)));
  render();
};
for (const k in FILTERS) $(k).onchange = () => { sel[k] = $(k).value; render(); };
['from', 'to', 'kmin', 'kmax'].forEach(id => $(id).oninput = render);
$('reset').onclick = () => {
  for (const k in FILTERS) sel[k] = '';
  $('from').value = min; $('to').value = max; $('week').value = 0; $('kmin').value = $('kmax').value = '';
  render();
};
$('view').onclick = () => setView(!document.body.classList.contains('list'));
$('list').onclick = e => {
  const b = e.target.closest('button[data-sort]');
  if (b) {
    sortDir = b.dataset.sort === sortKey ? -sortDir : 1;
    sortKey = b.dataset.sort;
    renderList();
    return;
  }
  const tr = e.target.closest('tr[data-key]');
  if (tr && !e.target.closest('a')) showRoute(tr);
};
$('list').onkeydown = e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-key]')) showRoute(e.target);
};
render();
</script>
</body>
</html>
