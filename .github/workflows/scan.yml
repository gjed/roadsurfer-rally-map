name: Scan and deploy map

on:
  schedule:
    - cron: "17 3 * * 1,4" # Monday and Thursday, off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Scan and build site
    runs-on: ubuntu-latest
    # ~850 requests at --delay 5 plus jitter take 70-90 minutes
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # cache keys are immutable: each run saves under its own key and restores the
      # newest earlier one, so only station pairs that are new get routed
      - name: Restore road distance cache
        uses: actions/cache/restore@v6
        with:
          path: road-distances.json
          key: road-distances-${{ github.run_id }}
          restore-keys: road-distances-

      # exits non-zero and writes nothing when more than 10% of requests fail
      - name: Scan
        run: python3 roadsurfer-rally.py --delay 5 --json-out offers.json

      # runs only after a scan that exited 0: a blocked or crashed scan saves nothing
      - name: Save road distance cache
        uses: actions/cache/save@v6
        with:
          path: road-distances.json
          key: road-distances-${{ github.run_id }}

      # read after the scan, so a release cut during it is shown
      - name: Render the map with the latest release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # empty before the first release: the page then shows no release tag
          TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')" || { echo "::warning::Could not read the latest release; rendering without a release tag."; TAG=""; }
          echo "Release tag: ${TAG:-none}"
          python3 roadsurfer-rally.py --from-json offers.json --map index.html --release "$TAG"

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r vendor _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload scan data
        uses: actions/upload-artifact@v7
        with:
          name: offers
          path: offers.json
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # shared with release.yml's deploy job only, so a queued scan and a queued release
    # never cancel each other's whole run, and two deploys never overlap
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
