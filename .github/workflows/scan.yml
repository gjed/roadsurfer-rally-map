name: Scan and deploy map

on:
  schedule:
    - cron: "17 3 * * 1,4" # Monday and Thursday, off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Scan and build site
    runs-on: ubuntu-latest
    # ~850 requests at --delay 5 plus jitter take 70-90 minutes
    timeout-minutes: 150
    # one scan at a time: two overlapping runs would each upload their own cache copy and
    # the last write would drop the pairs the other one routed. Not the `pages` group, which
    # only the deploy jobs share
    concurrency:
      group: road-distance-scan
      cancel-in-progress: false
    # id-token lets the AWS steps trade the OIDC token for the cache role; it stays off the
    # workflow and the deploy job, which uses the github-pages environment and its own sub claim
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # fallback copy of the road distance cache; the S3 download below overwrites it when
      # the bucket has the file. Cache keys are immutable: each run saves under its own key
      # and restores the newest earlier one, so only station pairs that are new get routed
      - name: Restore road distance cache
        uses: actions/cache/restore@v6
        with:
          path: road-distances.json
          key: road-distances-${{ github.run_id }}
          restore-keys: road-distances-

      # AWS problems never fail the scan: this step may fail, and the steps after it are
      # skipped. The variables are unset in a fork, so the AWS steps are skipped there
      - name: Configure AWS credentials
        id: aws
        if: ${{ vars.ROAD_DISTANCE_CACHE_BUCKET != '' && vars.ROAD_DISTANCE_CACHE_ROLE_ARN != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.ROAD_DISTANCE_CACHE_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Warn that AWS credentials failed
        if: ${{ steps.aws.outcome == 'failure' }}
        run: echo "::warning::Could not get AWS credentials; the road distance cache comes from the Actions cache."

      # a missing object is a 404 (the role may list the bucket); it is the normal first run
      - name: Download road distance cache from S3
        if: ${{ steps.aws.outcome == 'success' }}
        env:
          BUCKET: ${{ vars.ROAD_DISTANCE_CACHE_BUCKET }}
        run: |
          if out="$(aws s3 cp "s3://${BUCKET}/road-distances.json" road-distances.s3.json 2>&1)"; then
            mv road-distances.s3.json road-distances.json
            echo "Road distance cache: using the S3 copy."
          elif grep -qE '\(404\)|NoSuchKey|Key ".*" does not exist' <<<"$out"; then
            echo "::notice::No road distance cache in S3 yet; using the Actions cache copy, if any."
          else
            echo "::warning::Could not download the road distance cache from S3; using the Actions cache copy, if any. ${out//$'\n'/ }"
          fi

      # exits non-zero and writes nothing when more than 10% of requests fail
      - name: Scan
        run: python3 roadsurfer-rally.py --delay 5 --json-out offers.json

      # the upload and the save run only after a scan that exited 0: a blocked or crashed
      # scan stores nothing. A failed upload only warns, so the save below still runs
      - name: Upload road distance cache to S3
        if: ${{ steps.aws.outcome == 'success' }}
        env:
          BUCKET: ${{ vars.ROAD_DISTANCE_CACHE_BUCKET }}
        run: |
          if [ ! -f road-distances.json ]; then
            echo "::notice::No road distance cache file to upload."
          elif out="$(aws s3 cp road-distances.json "s3://${BUCKET}/road-distances.json" 2>&1)"; then
            echo "Road distance cache uploaded to S3."
          else
            echo "::warning::Could not upload the road distance cache to S3. ${out//$'\n'/ }"
          fi

      - name: Save road distance cache
        uses: actions/cache/save@v6
        with:
          path: road-distances.json
          key: road-distances-${{ github.run_id }}

      # read after the scan, so a release cut during it is shown
      - name: Render the map and the feeds with the latest release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # empty before the first release: the page then shows no release tag
          TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')" || { echo "::warning::Could not read the latest release; rendering without a release tag."; TAG=""; }
          echo "Release tag: ${TAG:-none}"
          python3 roadsurfer-rally.py --from-json offers.json --map index.html --feeds feeds --release "$TAG"

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r vendor _site/
          cp -r feeds _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload scan data
        uses: actions/upload-artifact@v7
        with:
          name: offers
          path: offers.json
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # shared with release.yml's deploy job only, so a queued scan and a queued release
    # never cancel each other's whole run, and two deploys never overlap
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
