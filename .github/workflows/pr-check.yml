name: PR Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: |
          set -euo pipefail
          pre-commit run --all-files --show-diff-on-failure || {
            EXIT_CODE=$?
            echo "::error::A pre-commit hook failed (ruff, ruff-format, mdformat, pymarkdown or a generic hook). Run 'pre-commit run --all-files' locally and commit the fixes shown above."
            exit $EXIT_CODE
          }

  python38:
    name: Python 3.8 (stated minimum)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # actions/setup-python has no 3.8 build for ubuntu-24.04 and newer; uv downloads its own.
      # Third-party action: pinned to a commit; the version comment lets Renovate update it.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.8"
          enable-cache: false

      - name: Install Python 3.8
        run: |
          set -euo pipefail
          { uv python install 3.8 && uv run --no-project python -c 'import sys; assert sys.version_info[:2] == (3, 8), sys.version'; } || {
            EXIT_CODE=$?
            echo "::error::uv could not provide Python 3.8. If uv no longer ships 3.8, raise the minimum in README.md, CONTRIBUTING.md, AGENTS.md, ruff.toml, this job and the Python 3.8 requirements in openspec/specs/ together, through an OpenSpec change."
            exit $EXIT_CODE
          }
          uv run --no-project python --version

      - name: Compile and run --help on 3.8
        run: |
          set -euo pipefail
          { uv run --no-project python -m py_compile roadsurfer-rally.py && uv run --no-project python roadsurfer-rally.py --help >/dev/null; } || {
            EXIT_CODE=$?
            echo "::error::roadsurfer-rally.py does not compile or start on Python 3.8, the stated minimum. Replace the newer syntax or stdlib API shown above (for example datetime.UTC: use timezone.utc) and check with 'uv run --python 3.8 python roadsurfer-rally.py --help'."
            exit $EXIT_CODE
          }

      - name: Unit tests on 3.8
        run: |
          set -euo pipefail
          uv run --no-project python -m unittest discover -s tests -v || {
            EXIT_CODE=$?
            echo "::error::Unit tests failed on Python 3.8, the stated minimum. Reproduce with 'uv run --python 3.8 python -m unittest discover -s tests -v' and replace the newer syntax or API."
            exit $EXIT_CODE
          }

      - name: Render the map from the fixture on 3.8 (offline)
        run: |
          set -euo pipefail
          uv run --no-project python roadsurfer-rally.py --from-json tests/fixtures/offers.json --map "$RUNNER_TEMP/index.html" --feeds "$RUNNER_TEMP/feeds" || {
            EXIT_CODE=$?
            echo "::error::Rendering tests/fixtures/offers.json failed on Python 3.8, the stated minimum. Reproduce with 'uv run --python 3.8 python roadsurfer-rally.py --from-json tests/fixtures/offers.json --map index.html --feeds feeds'."
            exit $EXIT_CODE
          }

  build:
    name: Test and build the map
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v || {
            EXIT_CODE=$?
            echo "::error::Unit tests failed. Fix roadsurfer-rally.py (or the test it broke) and re-run 'python3 -m unittest discover -s tests -v' locally."
            exit $EXIT_CODE
          }

      - name: Render the map from the fixture (offline)
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          python3 roadsurfer-rally.py --from-json tests/fixtures/offers.json --map "$SITE/index.html" --feeds "$SITE/feeds" || {
            EXIT_CODE=$?
            echo "::error::Rendering tests/fixtures/offers.json failed. Reproduce with 'python3 roadsurfer-rally.py --from-json tests/fixtures/offers.json --map index.html --feeds feeds' and fix the traceback above."
            exit $EXIT_CODE
          }

      - name: Check the generated page
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          PAGE="$SITE/index.html"
          if grep -qF '/*DATA*/[]' "$PAGE"; then
            echo "::error::The /*DATA*/[] placeholder is still in the page: render() did not insert the offers. Keep 'const DATA = /*DATA*/[];' in rally-map.template.html exactly as render() expects."
            exit 1
          fi
          if ! grep -qF 'vendor/leaflet/' "$PAGE" || grep -qiE '(src|href)="(https?:)?//[^"]*leaflet' "$PAGE"; then
            echo "::error::The page must load Leaflet from vendor/leaflet/ and must not load it from a CDN. Fix the <link>/<script> tags in rally-map.template.html."
            exit 1
          fi
          if ! grep -qF '<link rel="alternate" type="application/atom+xml"' "$PAGE"; then
            echo "::error::The page has no Atom feed <link rel=\"alternate\" type=\"application/atom+xml\"> in <head>. Keep the feed link of rally-map.template.html."
            exit 1
          fi
          python3 - "$SITE/feeds" <<'EOF' || {
          import glob
          import sys
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob(sys.argv[1] + "/*.xml"))
          assert any(f.endswith("/all.xml") for f in files), "no all.xml"
          for f in files:
              ET.parse(f)
              print("feed OK:", f)
          EOF
            echo "::error::A generated Atom feed is missing or is not well-formed XML (see the error above). Reproduce with 'python3 roadsurfer-rally.py --from-json tests/fixtures/offers.json --feeds feeds' and fix the feed code in roadsurfer-rally.py."
            exit 1
          }
          python3 - "$PAGE" "$SITE/map.js" <<'EOF' || {
          import sys
          html = open(sys.argv[1], encoding="utf-8").read()
          tag = '<script src="vendor/leaflet/leaflet.js"></script>'
          rest = html.split(tag, 1)[1]
          start = rest.index("<script>") + len("<script>")
          open(sys.argv[2], "w", encoding="utf-8").write(rest[start : rest.index("</script>", start)])
          EOF
            echo "::error::Could not find the inline <script> after the vendor/leaflet/leaflet.js tag. Keep the map script inline, right after that tag, in rally-map.template.html."
            exit 1
          }
          node --version
          node --check "$SITE/map.js" || {
            EXIT_CODE=$?
            echo "::error::The map's embedded JavaScript does not parse (see the node error above). Fix the <script> block in rally-map.template.html; the line numbers count from the start of that block."
            exit $EXIT_CODE
          }
          echo "Page OK: placeholder replaced, script parses, Leaflet from vendor/."
